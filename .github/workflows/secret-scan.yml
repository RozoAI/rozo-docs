name: Secret scan

# Report-only gitleaks scan of the commits introduced by this PR or push.
# Phase 1: never fails CI. Findings are redacted and listed in the job summary.
# Rules: gitleaks defaults plus org rules in .github/gitleaks.toml (Stellar seeds,
# EVM private keys, mnemonics, Supabase service-role keys).
# Local pre-commit hook: see .pre-commit-config.yaml and the README.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan (gitleaks, report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned release binary)
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks

      - name: Scan commit range (report-only)
        continue-on-error: true
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="$PR_BASE..$PR_HEAD"
          elif [ -n "$PUSH_BEFORE" ] && ! echo "$PUSH_BEFORE" | grep -qE '^0+$' \
               && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            RANGE="$PUSH_BEFORE..$PUSH_AFTER"
          else
            RANGE="-1 $PUSH_AFTER"
          fi

          set +e
          /tmp/gitleaks git . --config .github/gitleaks.toml --redact --no-banner --log-level warn \
            --log-opts="$RANGE" \
            --report-format json --report-path /tmp/gitleaks.json --exit-code 0
          rc=$?
          set -e

          {
            echo "## Secret scan (gitleaks ${GITLEAKS_VERSION}, report-only)"
            echo
            echo "Commit range: \`$RANGE\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$rc" -ne 0 ] || [ ! -s /tmp/gitleaks.json ]; then
            echo "Scan did not complete (gitleaks exit $rc). This does not block the build." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::gitleaks scan did not complete (exit $rc)."
            exit 0
          fi

          n=$(jq length /tmp/gitleaks.json)
          if [ "$n" -eq 0 ]; then
            echo "No potential secrets found." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "**$n potential secret(s) found.** Values are redacted. Do not paste them anywhere."
            echo "If a finding is real: rotate the key, then remove it from the code."
            echo
            echo "| Rule | File | Line | Commit |"
            echo "| --- | --- | --- | --- |"
            jq -r '.[] | "| \(.RuleID) | `\(.File | gsub("\\|"; "/"))` | \(.StartLine) | \(.Commit[0:7]) |"' /tmp/gitleaks.json
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::gitleaks found $n potential secret(s) in this change. See the job summary."
